[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-assembly-automator"
version = "0.1.0"
description = "Midjourney/Higgsfield/Magnific → Meshy → FBX.zip character asset pipeline orchestrator"
readme = "ASSET-ASSEMBLY-AUTOMATOR.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6",
    "qasync>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "tenacity>=8.2",
    "keyring>=25.0",
    "watchdog>=4.0",
    "Pillow>=10.2",
    "markdown>=3.5",
    "pyqtdarktheme-fork>=2.3",
    "mcp>=1.28",
]

[project.optional-dependencies]
preview = [
    "trimesh>=4.0",
    "pyrender>=0.1.45",
    "PyOpenGL>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.4",
    "ruff>=0.3",
    "mypy>=1.8",
    "pyinstaller>=6.4",
]

[project.scripts]
asset-assembly-automator = "asset_assembly_automator.cli:main"
asset-assembly-automator-gui = "asset_assembly_automator.gui.main:main"
aaa = "asset_assembly_automator.cli:main"
aaa-gui = "asset_assembly_automator.gui.main:main"
aaa-workflow = "asset_assembly_automator.gui.workflow_main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["asset_assembly_automator*"]

[tool.setuptools.package-data]
asset_assembly_automator = [
    "core/db/schema.sql",
    "gui/theme/*.qss",
    "gui/resources/**/*.md",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["asset_assembly_automator", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
